<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meteo Città OLO — Nowcasting Italia</title>
<style>
:root{--cyan:#65eaff;--ink:#e4faff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020b1c}
body{color:var(--ink);font-family:system-ui,Arial,sans-serif}
button,select{font:inherit}
button{cursor:pointer}
.launch-page{
 min-height:100dvh;display:grid;place-items:center;
 text-align:center;padding:20px;
 background:radial-gradient(ellipse at bottom,#114777,#020b1c);
}
.launch-btn{
 padding:20px 30px;border:2px solid var(--cyan);
 border-radius:18px;background:#092b4c;color:white;
 font-weight:900;font-size:20px;
 box-shadow:0 0 25px #00cfff88;
}
.launch-btn span{display:block;font-size:40px}
.launch-page p{color:#9dd9f2}
.overlay{
 position:fixed;inset:0;z-index:10;
 display:grid;place-items:center;
 background:#010a1bf2;
 opacity:0;visibility:hidden;
 transition:opacity .15s,visibility .15s;
}
.overlay.open{opacity:1;visibility:visible}
.holo{
 width:min(1150px,96vw);max-height:96dvh;
 overflow:auto;position:relative;isolation:isolate;
 padding:clamp(12px,2vw,24px);
 border:2px solid #4deaff;border-radius:18px;
 background:linear-gradient(145deg,#092f59,#04142e 70%);
 box-shadow:0 0 20px #00d9ff,inset 0 0 32px #008dff55;
 scrollbar-width:thin;scrollbar-color:#23bce9 #062342;
}
.holo:before{
 content:"";position:absolute;inset:0;z-index:-1;
 pointer-events:none;
 background:repeating-linear-gradient(
 0deg,transparent 0 5px,#66eaff0b 6px 7px);
}
.top{
 display:flex;align-items:center;gap:12px;
 border-bottom:1px solid #2e87b6;
 padding-bottom:12px;
}
.emblem{
 width:48px;height:48px;flex-shrink:0;
 border:1px solid #65eaff;border-radius:50%;
 display:grid;place-items:center;
 font-size:27px;box-shadow:0 0 15px #00d9ff88;
}
.heading{flex:1;min-width:0}
.heading small{font-size:10px;color:#8fd9f0;letter-spacing:2px}
.heading h1{
 margin:2px 0;font-size:clamp(23px,5vw,40px);
 color:#b3faff;text-shadow:0 0 15px #19bfff;
 letter-spacing:2px;
}
.heading p{margin:0;font-size:12px;letter-spacing:2px;color:#a4d9ed}
.close{
 width:43px;height:43px;flex-shrink:0;
 border:1px solid #4de5ff;border-radius:10px;
 background:#092d52;color:white;font-size:25px;
}
.controls{
 display:flex;align-items:center;justify-content:space-between;
 flex-wrap:wrap;gap:10px;margin:16px 0;
}
.controls label{color:#a5eaff;font-weight:750}
select{
 max-width:100%;padding:11px;border-radius:10px;
 border:1px solid #40dfff;background:#092d50;color:white;
}
.coord,.status{font-size:12px;color:#9bd9ed}
.status{min-height:25px;margin-bottom:10px}
.cards{
 display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
 gap:11px;
}
.card{
 min-width:0;padding:12px 6px;text-align:center;
 border:1px solid #36cfff;border-radius:14px;
 background:linear-gradient(#0a3863c9,#03152df0);
 box-shadow:0 0 13px #009fff44,inset 0 0 18px #008fff33;
}
.day{font-size:18px;font-weight:900}
.date{font-size:12px;color:#9bcae3}
.weather{
 height:120px;position:relative;
 display:grid;place-items:center;
}
.weather svg{
 width:125px;max-width:100%;height:105px;
 overflow:visible;filter:drop-shadow(0 0 9px #17bfff88);
}
.orbit{
 position:absolute;bottom:4px;width:83%;height:13px;
 border:2px solid #46dfff;border-radius:50%;
 box-shadow:0 0 12px #00eaff;
 animation:glow 2.6s infinite;
}
.weather .cloud{animation:float 3s infinite}
.weather .sun{animation:glow 3s infinite}
.weather .drop{animation:rain 1.2s infinite}
.weather .bolt{animation:flash 2.7s infinite}
.weather .fog{animation:float 4s infinite}
.desc{
 min-height:40px;display:grid;place-items:center;
 font-size:12px;font-weight:650;
}
.temp{margin:9px 0;font-size:20px;font-weight:850}
.max{color:#ffbb72}.min{color:#70dfff}
.rainfall{font-size:13px;color:#7cdeff}
.projection{
 height:35px;margin-top:14px;position:relative;overflow:hidden;
}
.projection:before{
 content:"";position:absolute;left:12%;right:12%;top:5px;
 height:55px;border:2px solid #50eaff;border-radius:50%;
 transform:perspective(100px) rotateX(60deg);
 box-shadow:0 0 22px #00dfff;
}
.credits{
 margin-top:12px;padding-top:12px;
 border-top:1px solid #277ca8;
 display:flex;justify-content:space-between;
 flex-wrap:wrap;gap:8px;font-size:11px;color:#a5cfe5;
}
.credits a{color:#85edff}

/* MEMBRANA ENERGETICA INVERSA */
.energy-shell{
 position:absolute;inset:0;z-index:8;
 border-radius:18px;overflow:hidden;
 pointer-events:none;visibility:hidden;
}
.energy-border{
 position:absolute;inset:2px;border-radius:17px;
 border:3px solid #7bfaff;
 box-shadow:0 0 12px #00eaff,0 0 30px #00aaff,
 inset 0 0 20px #00dfff;
 opacity:0;
}
.energy-field{
 position:absolute;inset:0;
 background:
 radial-gradient(ellipse at 22% 33%,#b7ffffcc,transparent 27%),
 radial-gradient(ellipse at 77% 68%,#09bfffaa,transparent 34%),
 repeating-radial-gradient(ellipse at 50% 50%,
 #37f6ff33 0 7px,#0065d066 12px 25px,
 #020e34 32px 48px);
 filter:contrast(1.6) saturate(1.5);
 opacity:0;
}
.energy-field:before{
 content:"";position:absolute;inset:-35%;
 background:conic-gradient(from 20deg,
 transparent,#7ffeff99,transparent,#127cf5aa,
 transparent,#b6ffff88,transparent);
 animation:swirl 1.4s linear infinite;
 mix-blend-mode:screen;
}
.energy-field:after{
 content:"";position:absolute;inset:0;
 background:repeating-linear-gradient(
 135deg,transparent 0 14px,#a2ffff55 16px,
 transparent 20px 34px);
 animation:flow 1s linear infinite;
}
.energy-flash{
 position:absolute;inset:0;
 background:#c5ffff;opacity:0;
}
.holo-content{position:relative;z-index:1}
.overlay.open:not(.ready) .holo-content{
 opacity:0;transform:translateY(12px);
}
.overlay.ready .holo-content{
 animation:contentReveal .65s ease-out both;
}
.overlay.open .energy-shell{visibility:visible}
.overlay.open .energy-border{
 animation:traceBorder 2.65s ease-out both;
}
.overlay.open .energy-field{
 animation:formField 2.65s ease-in-out both;
}
.overlay.open .energy-flash{
 animation:finalFlash 2.65s ease-out both;
}
.overlay.ready .energy-shell{
 visibility:hidden;
}
.overlay.ready .card{
 animation:cardReveal .55s ease-out both;
}
.overlay.ready .card:nth-child(2){animation-delay:.12s}
.overlay.ready .card:nth-child(3){animation-delay:.24s}
.overlay.ready .card:nth-child(4){animation-delay:.36s}
.overlay.ready .card:nth-child(5){animation-delay:.48s}
@keyframes traceBorder{
 0%{opacity:0;clip-path:inset(48% 48%)}
 12%{opacity:1}
 38%,88%{opacity:1;clip-path:inset(0)}
 100%{opacity:0;clip-path:inset(0)}
}
@keyframes formField{
 0%,16%{opacity:0;clip-path:circle(0% at 50% 50%)}
 30%{opacity:.65}
 58%{opacity:1;clip-path:circle(75% at 50% 50%)}
 72%{opacity:1;clip-path:circle(110% at 50% 50%)}
 100%{opacity:0;clip-path:circle(110% at 50% 50%)}
}
@keyframes finalFlash{
 0%,75%,100%{opacity:0}
 84%{opacity:.36}
}
@keyframes contentReveal{
 from{opacity:0;transform:translateY(12px);filter:blur(6px)}
 to{opacity:1;transform:none;filter:none}
}
@keyframes cardReveal{
 from{opacity:0;transform:translateY(20px) scale(.95)}
 to{opacity:1;transform:none}
}
@keyframes swirl{to{transform:rotate(360deg)}}
@keyframes flow{to{background-position:70px 0}}
@keyframes glow{50%{filter:brightness(1.5);opacity:.8}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes rain{50%{transform:translateY(8px);opacity:.35}}
@keyframes flash{
 0%,43%,49%,100%{opacity:1}
 45%,47%{opacity:.1}
}
@media(max-width:800px){
 .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
 .weather{height:100px}
 .weather svg{height:90px}
 .card{padding:10px 5px}
 .heading h1{font-size:24px}
}
@media(max-width:420px){
 .holo{padding:12px}
 .day{font-size:15px}
 .temp{font-size:18px}
 .close{width:37px;height:37px}
 .heading small{font-size:9px}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{
  animation:none!important;transition:none!important;
 }
 .overlay.open .holo-content{opacity:1;transform:none}
 .overlay.open .energy-shell{display:none}
}
</style>
</head>
<body>
<main class="launch-page" id="launchPage">
 <div>
  <h2>NOWCASTING ITALIA</h2>
  <p>DASHBOARD ENTERPRISE</p>
  <button id="launch" class="launch-btn">
   <span>🌍</span>METEO CITTÀ
  </button>
  <p>Attiva lo schermo olografico</p>
 </div>
</main>
<div class="overlay" id="overlay" aria-hidden="true">
 <section class="holo" role="dialog"
  aria-modal="true" aria-label="Meteo Città">
  <div class="energy-shell" aria-hidden="true">
   <div class="energy-border"></div>
   <div class="energy-field"></div>
   <div class="energy-flash"></div>
  </div>
  <div class="holo-content">
   <header class="top">
    <div class="emblem">◉</div>
    <div class="heading">
     <small>NOWCASTING ITALIA · ENTERPRISE</small>
     <h1>METEO CITTÀ</h1>
     <p>PREVISIONI A 5 GIORNI</p>
    </div>
    <button class="close" id="close"
     aria-label="Chiudi">✕</button>
   </header>
   <div class="controls">
    <div>
     <label for="city">LOCALITÀ: </label>
     <select id="city">
      <option value="41.8919,12.5113">Roma</option>
      <option value="45.4642,9.1900">Milano</option>
      <option value="40.8518,14.2681">Napoli</option>
      <option value="45.0703,7.6869">Torino</option>
      <option value="38.1157,13.3615">Palermo</option>
      <option value="44.4949,11.3426">Bologna</option>
      <option value="43.7696,11.2558">Firenze</option>
      <option value="41.1259,16.8719">Bari</option>
      <option value="45.4371,12.3326">Venezia</option>
      <option value="39.2238,9.1217">Cagliari</option>
      <option value="44.4056,8.9463">Genova</option>
      <option value="45.6495,13.7768">Trieste</option>
      <option value="43.6158,13.5189">Ancona</option>
      <option value="43.1107,12.3908">Perugia</option>
      <option value="42.3498,13.3995">L'Aquila</option>
      <option value="37.5079,15.0830">Catania</option>
     </select>
    </div>
    <div class="coord" id="coord"></div>
   </div>
   <div class="status" id="status"
    role="status" aria-live="polite"></div>
   <div class="cards" id="cards"></div>
   <div class="projection" aria-hidden="true"></div>
   <footer class="credits">
    <span>
     Fonte:
     <a href="https://open-meteo.com/"
      target="_blank" rel="noopener">Open-Meteo</a>
     · <a href="https://open-meteo.com/en/terms"
      target="_blank" rel="noopener">Termini</a>
     · <a href="https://creativecommons.org/licenses/by/4.0/"
      target="_blank" rel="noopener">CC BY 4.0</a>
    </span>
    <span>Previsioni modellistiche, non osservazioni</span>
   </footer>
  </div>
 </section>
</div>
<script>
"use strict";
const overlay=document.getElementById("overlay");
const cards=document.getElementById("cards");
const statusEl=document.getElementById("status");
const city=document.getElementById("city");
const coord=document.getElementById("coord");
const embedded=new URLSearchParams(location.search).has("embed");
const cache=new Map();
let controller=null;
let requestId=0;
let audioContext=null;
let revealTimer=null;
 
function soundOlo(){
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return;
 try{
  if(!audioContext)audioContext=new AC();
  const ac=audioContext;
  ac.resume().catch(()=>{});
  const t=ac.currentTime;
  const master=ac.createGain();
  master.gain.value=.22;
  master.connect(ac.destination);

  function tone(type,from,to,start,dur,vol){
   const osc=ac.createOscillator();
   const gain=ac.createGain();
   osc.type=type;
   osc.frequency.setValueAtTime(from,t+start);
   osc.frequency.exponentialRampToValueAtTime(
    Math.max(1,to),t+start+dur);
   gain.gain.setValueAtTime(.0001,t+start);
   gain.gain.linearRampToValueAtTime(
    vol,t+start+Math.min(.15,dur*.25));
   gain.gain.exponentialRampToValueAtTime(
    .0001,t+start+dur);
   osc.connect(gain);gain.connect(master);
   osc.start(t+start);osc.stop(t+start+dur+.02);
  }
  function noise(start,dur,vol,frequency){
   const length=Math.ceil(ac.sampleRate*dur);
   const buffer=ac.createBuffer(1,length,ac.sampleRate);
   const samples=buffer.getChannelData(0);
   for(let i=0;i<length;i++)
    samples[i]=Math.random()*2-1;
   const src=ac.createBufferSource();
   src.buffer=buffer;
   const filter=ac.createBiquadFilter();
   filter.type="lowpass";filter.frequency.value=frequency;
   const gain=ac.createGain();
   gain.gain.setValueAtTime(.0001,t+start);
   gain.gain.linearRampToValueAtTime(vol,t+start+.18);
   gain.gain.exponentialRampToValueAtTime(
    .0001,t+start+dur);
   src.connect(filter);filter.connect(gain);
   gain.connect(master);
   src.start(t+start);src.stop(t+start+dur);
  }
  // Rombo basso: generatore energetico
  tone("sawtooth",48,82,0,.9,.27);
  tone("triangle",75,115,.2,1.4,.24);
  // Membrana che si espande
  noise(.45,1.65,.32,950);
  tone("sawtooth",90,170,.8,1.25,.13);
  // Scarica finale e stabilizzazione
  noise(2.05,.4,.19,2300);
  tone("triangle",220,95,2.15,.5,.15);
  setTimeout(()=>master.disconnect(),3300);
 }catch(e){console.warn("Audio OLO:",e)}
}

function weatherSvg(type){
 const start='<svg viewBox="0 0 150 120" '+
  'xmlns="http://www.w3.org/2000/svg">';
 const end='</svg>';
 const sun=`<g class="sun">
  <circle cx="91" cy="38" r="22"
   fill="#ffcf59" stroke="#ffe9a1" stroke-width="3"/>
  <g stroke="#ffb636" stroke-width="4"
   stroke-linecap="round">
   <path d="M91 6V1M91 72V80M59 38H51
    M123 38H132M69 16L62 9M113 60L120 67
    M113 16L120 9M69 60L62 67"/>
  </g></g>`;
 const cloud=`<g class="cloud"
  fill="#78c8f4" stroke="#c0f5ff" stroke-width="2">
  <path d="M35 84C14 82 16 56 38 55
   C40 35 68 29 80 48
   C102 35 125 50 123 70
   C138 86 114 94 99 91H45
   C39 91 36 88 35 84Z"/>
  </g>`;
 const rain=`<g fill="#34ddff">
  <path class="drop" d="M44 94l-6 14q0 9 7 8t5-9z"/>
  <path class="drop" d="M73 94l-6 14q0 9 7 8t5-9z"/>
  <path class="drop" d="M102 94l-6 14q0 9 7 8t5-9z"/>
  </g>`;
 const bolt=`<path class="bolt"
  d="M82 82L66 101H81L70 120
  L108 91H89L100 82Z"
  fill="#c78bff" stroke="#f3dcff" stroke-width="2"/>`;
 const fog=`<g class="fog" stroke="#9ae6ff"
  stroke-width="5" stroke-linecap="round">
  <path d="M25 91H123M36 103H110M52 115H122"/>
  </g>`;
 const snow=`<g fill="#e3fbff" font-size="25">
  <text x="35" y="113">✳</text>
  <text x="75" y="115">✳</text>
  <text x="105" y="111">✳</text>
  </g>`;
 let drawing=sun+cloud;
 if(type==="sun")drawing=sun;
 if(type==="cloud")drawing=cloud;
 if(type==="fog")drawing=cloud+fog;
 if(type==="rain")drawing=cloud+rain;
 if(type==="storm")drawing=cloud+bolt;
 if(type==="snow")drawing=cloud+snow;
 if(type==="showers")drawing=sun+cloud+rain;
 return start+drawing+end;
}

function condition(code){
 if(code===0)return["Sereno","sun"];
 if(code===1||code===2)
  return["Parzialmente nuvoloso","partly"];
 if(code===3)return["Coperto","cloud"];
 if(code===45||code===48)return["Nebbia","fog"];
 if([51,53,55,56,57,61,63,65,66,67].includes(code))
  return["Pioggia","rain"];
 if([80,81,82].includes(code))return["Rovesci","showers"];
 if([71,73,75,77,85,86].includes(code))
  return["Neve","snow"];
 if([95,96,99].includes(code))return["Temporale","storm"];
 return["Variabile","partly"];
}

function render(d){
 cards.replaceChildren();
 d.time.slice(0,5).forEach((date,i)=>{
  const [desc,type]=condition(d.weather_code[i]);
  const day=new Date(date+"T12:00:00");
  const name=day.toLocaleDateString("it-IT",{
   weekday:"short"}).toUpperCase();
  const formatted=day.toLocaleDateString("it-IT",{
   day:"2-digit",month:"2-digit"});
  const high=Number(d.temperature_2m_max[i]);
  const low=Number(d.temperature_2m_min[i]);
  const rain=Number(d.precipitation_sum[i]);
  const card=document.createElement("article");
  card.className="card";
  card.innerHTML=`
   <div class="day">${name}</div>
   <div class="date">${formatted}</div>
   <div class="weather">
    ${weatherSvg(type)}
    <div class="orbit"></div>
   </div>
   <div class="desc">${desc}</div>
   <div class="temp">
    <span class="max">${Number.isFinite(high)?
     Math.round(high)+"°":"—"}</span>
    /
    <span class="min">${Number.isFinite(low)?
     Math.round(low)+"°":"—"}</span>
   </div>
   <div class="rainfall">
    💧 ${Number.isFinite(rain)?
     rain.toFixed(1)+" mm":"—"}
   </div>`;
  cards.appendChild(card);
 });
}

async function loadForecast(){
 const id=++requestId;
 const [lat,lon]=city.value.split(",");
 coord.textContent=`Lat ${lat} · Lon ${lon}`;
 if(controller)controller.abort();
 controller=new AbortController();

 const saved=cache.get(city.value);
 if(saved&&Date.now()-saved.time<1200000){
  render(saved.data);
  statusEl.textContent="Previsioni in cache · "+
   city.options[city.selectedIndex].text;
  return;
 }
 cards.replaceChildren();
 statusEl.textContent="Acquisizione dati in corso...";
 const url="https://api.open-meteo.com/v1/forecast"+
  "?latitude="+encodeURIComponent(lat)+
  "&longitude="+encodeURIComponent(lon)+
  "&daily=weather_code,temperature_2m_max,"+
  "temperature_2m_min,precipitation_sum"+
  "&timezone=Europe%2FRome&forecast_days=5";
 try{
  const response=await fetch(url,{
   signal:controller.signal
  });
  if(!response.ok)
   throw new Error("HTTP "+response.status);
  const json=await response.json();
  const d=json.daily;
  const keys=["time","weather_code",
   "temperature_2m_max","temperature_2m_min",
   "precipitation_sum"];
  if(!d||!keys.every(k=>
   Array.isArray(d[k])&&d[k].length>=5))
   throw new Error("Previsioni incomplete");
  if(id!==requestId)return;
  cache.set(city.value,{time:Date.now(),data:d});
  render(d);
  statusEl.textContent="Previsioni ricevute · "+
   city.options[city.selectedIndex].text+
   " · "+new Date().toLocaleTimeString(
   "it-IT",{hour:"2-digit",minute:"2-digit"});
 }catch(e){
  if(e.name==="AbortError"||id!==requestId)return;
  statusEl.textContent=
   "Dati non disponibili. Riprova più tardi.";
  console.error("Meteo Città:",e);
 }
}

function openOlo(){
 clearTimeout(revealTimer);
 overlay.classList.remove("open","ready");
 void overlay.offsetWidth;
 overlay.classList.add("open");
 overlay.setAttribute("aria-hidden","false");
 soundOlo();
 loadForecast();
 const reduced=matchMedia(
  "(prefers-reduced-motion: reduce)").matches;
 revealTimer=setTimeout(()=>{
  overlay.classList.add("ready");
 },reduced?0:2650);
}
function closeOlo(){
 clearTimeout(revealTimer);
 overlay.classList.remove("open","ready");
 overlay.setAttribute("aria-hidden","true");
 if(controller)controller.abort();
 requestId++;
 if(embedded){
  window.parent.postMessage({
   type:"NOWCASTING_METEO_CLOSE"
  },location.origin);
 }
}
document.getElementById("launch")
 .addEventListener("click",openOlo);
document.getElementById("close")
 .addEventListener("click",closeOlo);
city.addEventListener("change",loadForecast);
overlay.addEventListener("click",e=>{
 if(e.target===overlay)closeOlo();
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeOlo();
});
if(embedded){
 document.getElementById("launchPage").style.display="none";
 openOlo();
}
</script>
</body>
</html>
