name: N.I. Sinottica NOAA GFS
on:
  push:
    branches: [main, feature/ni-sinottica]
    paths:
      - 'backend/ni_gfs.py'
      - 'backend/ni_front_candidates.py'
      - 'backend/ni_front_validation.py'
      - 'backend/test_ni_front_validation.py'
      - 'backend/test_ni_front_candidates.py'
      - 'backend/requirements-sinottica.txt'
      - '.github/workflows/ni-sinottica.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 2,8,14,20 * * *'
permissions:
  contents: write
concurrency:
  group: ni-sinottica
  cancel-in-progress: false
jobs:
  forecast:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ni-sinottica'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-sinottica.txt
      - run: pip install -r backend/requirements-sinottica.txt
      - name: Offline algorithm and front validation checks
        run: |
          python backend/test_sinottica.py
          python backend/test_ni_front_validation.py
          python backend/test_ni_front_candidates.py
      - name: Retrieve and analyze NOAA GFS
        run: python backend/ni_gfs.py
      - name: Commit updated data to current branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sinottica.json
          if ! git diff --cached --quiet; then
            git commit -m "data(sinottica): refresh NOAA GFS"
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
              sleep $((attempt * 3))
            done
            echo "Unable to push updated data after three retries" >&2
            exit 1
          fi
