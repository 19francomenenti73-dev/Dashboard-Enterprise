name: N.I. Sinottica NOAA GFS
on:
  push:
    branches: [main, feature/ni-sinottica]
    paths:
      - 'backend/ni_gfs.py'
      - 'backend/ni_front_candidates.py'
      - 'backend/ni_front_validation.py'
      - 'backend/test_ni_front_validation.py'
      - 'backend/test_ni_front_candidates.py'
      - 'backend/requirements-sinottica.txt'
      - '.github/workflows/ni-sinottica.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 2,8,14,20 * * *'
permissions:
  contents: write
concurrency:
  group: ni-sinottica
  cancel-in-progress: false
jobs:
  forecast:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ni-sinottica'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-sinottica.txt
      - run: pip install -r backend/requirements-sinottica.txt
      - name: Offline algorithm and front validation checks
        run: |
          python backend/test_sinottica.py
          python backend/test_ni_front_validation.py
          python backend/test_ni_front_candidates.py
      - name: Retrieve and analyze NOAA GFS
        run: python backend/ni_gfs.py
      - name: Publish generated data without rebase conflicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp data/sinottica.json /tmp/ni-sinottica-generated.json
          python - <<'PY'
          import base64, json, os, pathlib, time, urllib.request, urllib.error
          repo=os.environ["GITHUB_REPOSITORY"]
          branch=os.environ["GITHUB_REF_NAME"]
          token=os.environ["GH_TOKEN"]
          url=f"https://api.github.com/repos/{repo}/contents/data/sinottica.json"
          content=base64.b64encode(pathlib.Path("/tmp/ni-sinottica-generated.json").read_bytes()).decode()
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"NowcastingItalia-Sinottica"}
          for attempt in range(5):
              request=urllib.request.Request(url+"?ref="+branch,headers=headers)
              with urllib.request.urlopen(request,timeout=45) as response:
                  current=json.load(response)
              body=json.dumps({"message":"data(sinottica): refresh NOAA GFS","content":content,"sha":current["sha"],"branch":branch}).encode()
              req=urllib.request.Request(url,data=body,headers={**headers,"Content-Type":"application/json"},method="PUT")
              try:
                  with urllib.request.urlopen(req,timeout=90) as response:
                      result=json.load(response)
                  print("Published GFS data:",result["commit"]["sha"])
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code not in (409,422) or attempt==4:raise
                  print("Concurrent data update; retrying",attempt+1)
                  time.sleep(2*(attempt+1))
          PY
