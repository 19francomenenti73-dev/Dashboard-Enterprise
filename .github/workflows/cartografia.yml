name: N.I. Cartografia originale
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Genera GeoJSON Natural Earth
        run: python genera_cartografia.py
      - name: Commit solo sul branch di sviluppo
        if: github.ref_name == 'feature/ni-sinottica'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cartografia/
          if ! git diff --cached --quiet; then
            git commit -m "Generate N.I. local Natural Earth basemap"
            git push
          fi
