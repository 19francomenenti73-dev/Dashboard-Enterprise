<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geodetic & Space Weather Observatory</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            background-color: #0b0f19 !important;
            color: #f8fafc !important;
            width: 100%;
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        .obs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00f3ff;
            padding-bottom: 10px;
            margin-bottom: 15px;
            background-color: #0b0f19;
        }

        .obs-title {
            font-size: 0.95rem;
            color: #00f3ff;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .obs-badge {
            background: #0f172a;
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: bold;
        }

        .obs-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        @media(min-width: 480px) {
            .obs-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .obs-card {
            background-color: #101726;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
        }

        .obs-card h3 {
            font-size: 0.8rem;
            color: #f59e0b;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .obs-value {
            font-size: 1.15rem;
            font-weight: bold;
            color: #f8fafc;
        }

        .obs-sub {
            font-size: 0.65rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .obs-chart-box {
            background-color: #101726;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            height: 260px;
            width: 100%;
        }

        .obs-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0b0f19;
            border-top: 1px solid #00f3ff;
            padding: 8px 10px;
            font-size: 0.6rem;
            color: #94a3b8;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            z-index: 99999;
        }

        .obs-source-item {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 2px 5px;
        }

        .obs-dot {
            width: 4px;
            height: 4px;
            background-color: #00f3ff;
            border-radius: 50%;
        }

        .obs-source-item span {
            color: #f8fafc;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="obs-header">
        <h1 class="obs-title">⚡ Geodetic Observatory</h1>
        <div class="obs-badge">100% REAL OPEN DATA</div>
    </div>

    <div class="obs-grid">
        <div class="obs-card">
            <h3>Vento Solare & CME</h3>
            <div class="obs-value" id="obs-wind">Connessione...</div>
            <div class="obs-sub" id="obs-wind-sub">NOAA SWPC Plasma Feed</div>
        </div>
        <div class="obs-card">
            <h3>Indice Kp Geomagnetico</h3>
            <div class="obs-value" id="obs-kp">--</div>
            <div class="obs-sub" id="obs-kp-sub">NOAA Magnetometro</div>
        </div>
        <div class="obs-card">
            <h3>Sismicità Globale</h3>
            <div class="obs-value" id="obs-quake">--</div>
            <div class="obs-sub" id="obs-quake-sub">USGS Ultime 24h (M > 4.5)</div>
        </div>
        <div class="obs-card">
            <h3>Orbite & Congiunzioni</h3>
            <div class="obs-value" id="obs-astro">Calcolo...</div>
            <div class="obs-sub" id="obs-astro-sub">Effemeridi J2000</div>
        </div>
    </div>

    <div class="obs-chart-box">
        <canvas id="obsChart"></canvas>
    </div>

    <footer class="obs-banner">
        <div class="obs-source-item"><div class="obs-dot"></div><div>Vento/Kp: <span>NOAA SWPC</span></div></div>
        <div class="obs-source-item"><div class="obs-dot"></div><div>Sismicità: <span>USGS</span></div></div>
        <div class="obs-source-item"><div class="obs-dot"></div><div>Celeste: <span>J2000</span></div></div>
    </footer>

    <script>
        let myChart = null;
        try {
            const canvas = document.getElementById('obsChart');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                myChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: 'Indice Kp (NOAA Reale)',
                            data: [],
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            borderWidth: 2,
                            tension: 0.2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
                            x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } }
                        }
                    }
                });
            }
        } catch (e) {
            console.error("Chart init error:", e);
        }

        function calculateAstro() {
            try {
                const now = new Date();
                const d = (now - Date.parse("2000-01-01T12:00:00Z")) / 86400000;
                const merc = (252.25 + 4.092338 * d) % 360;
                const venus = (181.98 + 1.602130 * d) % 360;
                const mars = (355.45 + 0.524039 * d) % 360;
                const jup = (34.35 + 0.083085 * d) % 360;

                let status = "Dispersione Standard";
                if (Math.abs(merc - venus) < 12 || Math.abs(venus - mars) < 12 || Math.abs(merc - jup) < 15) {
                    status = "Congiunzione Attiva";
                }
                document.getElementById('obs-astro').innerText = status;
                document.getElementById('obs-astro-sub').innerText = `Mer: ${Math.round(merc)}° | Ven: ${Math.round(venus)}°`;
            } catch (err) {
                document.getElementById('obs-astro').innerText = "Calcolo Effemeridi";
            }
        }

        async function loadRealData() {
            calculateAstro();

            try {
                const resKp = await fetch('https://services.swpc.noaa.gov/json/planetary_k_index_1h.json');
                const dataKp = await resKp.json();
                if (dataKp && dataKp.length > 0) {
                    const latest = dataKp[dataKp.length - 1];
                    document.getElementById('obs-kp').innerText = `Kp ${latest.kp}`;
                    document.getElementById('obs-kp-sub').innerText = `UTC: ${latest.time_tag.replace('T', ' ').substring(11, 16)}`;

                    if (myChart) {
                        myChart.data.labels = dataKp.slice(-10).map(i => i.time_tag.substring(11, 16));
                        myChart.data.datasets[0].data = dataKp.slice(-10).map(i => i.kp);
                        myChart.update();
                    }
                }
            } catch (e) {
                document.getElementById('obs-kp').innerText = "Dato NOAA N/D";
            }

            try {
                const resWind = await fetch('https://services.swpc.noaa.gov/products/solar-wind/plasma-6-hour.json');
                const dataWind = await resWind.json();
                if (dataWind && dataWind.length > 1) {
                    const latestW = dataWind[dataWind.length - 1];
                    document.getElementById('obs-wind').innerText = `${Math.round(latestW[1])} km/s`;
                    document.getElementById('obs-wind-sub').innerText = `Densità: ${parseFloat(latestW[2]).toFixed(2)} p/cm³`;
                }
            } catch (e) {
                document.getElementById('obs-wind').innerText = "Dato NOAA N/D";
            }

            try {
                const resUsgs = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson');
                const dataUsgs = await resUsgs.json();
                if (dataUsgs && dataUsgs.features) {
                    document.getElementById('obs-quake').innerText = `${dataUsgs.features.length} Eventi (M > 4.5)`;
                    if (dataUsgs.features.length > 0) {
                        const maxM = Math.max(...dataUsgs.features.map(f => f.properties.mag));
                        document.getElementById('obs-quake-sub').innerText = `Max Magnitudo: M ${maxM.toFixed(1)}`;
                    }
                }
            } catch (e) {
                document.getElementById('obs-quake').innerText = "Dato USGS N/D";
            }
        }

        loadRealData();
    </script>
</body>
</html>
