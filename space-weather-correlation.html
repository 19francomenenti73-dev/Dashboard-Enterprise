    <script>
        let myChart = null;

        try {
            const canvas = document.getElementById('obsChart');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                myChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [
                            {
                                label: 'Indice Kp (NOAA)',
                                data: [],
                                borderColor: '#f59e0b',
                                backgroundColor: 'rgba(245, 158, 11, 0.1)',
                                borderWidth: 2,
                                yAxisID: 'yKp',
                                tension: 0.2
                            },
                            {
                                label: 'Vento Solare (km/s)',
                                data: [],
                                borderColor: '#00f3ff',
                                backgroundColor: 'rgba(0, 243, 255, 0.1)',
                                borderWidth: 2,
                                yAxisID: 'yWind',
                                tension: 0.2
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } },
                            yKp: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                min: 0,
                                max: 9,
                                ticks: { color: '#f59e0b', stepSize: 2, font: { size: 10 } },
                                grid: { color: '#1e293b' }
                            },
                            yWind: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                min: 200,
                                max: 900,
                                ticks: { color: '#00f3ff', font: { size: 10 } },
                                grid: { drawOnChartArea: false }
                            }
                        }
                    }
                });
            }
        } catch (e) {
            console.error("Chart error:", e);
        }

        function calculateAstro() {
            try {
                const now = new Date();
                const d = (now - Date.parse("2000-01-01T12:00:00Z")) / 86400000;
                const merc = (252.25 + 4.092338 * d) % 360;
                const venus = (181.98 + 1.602130 * d) % 360;
                const mars = (355.45 + 0.524039 * d) % 360;
                const jup = (34.35 + 0.083085 * d) % 360;

                let status = "Dispersione Standard";
                if (Math.abs(merc - venus) < 12 || Math.abs(venus - mars) < 12 || Math.abs(merc - jup) < 15) {
                    status = "Congiunzione Attiva";
                }
                document.getElementById('obs-astro').innerText = status;
                document.getElementById('obs-astro-sub').innerText = `Mer: ${Math.round(merc)}° | Ven: ${Math.round(venus)}°`;
            } catch (err) {
                document.getElementById('obs-astro').innerText = "Calcolo Effemeridi";
            }
        }

        async function loadRealData() {
            calculateAstro();

            let timeLabels = [];
            let kpArray = [];
            let windArray = [];

            // 1. NOAA Kp Index tramite Proxy CORS
            try {
                const targetKp = 'https://services.swpc.noaa.gov/json/planetary_k_index_1h.json';
                const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetKp)}`);
                const dataKp = await res.json();
                if (Array.isArray(dataKp) && dataKp.length > 0) {
                    const latest = dataKp[dataKp.length - 1];
                    const kpVal = latest.kp !== undefined ? latest.kp : '--';
                    const timeTag = latest.time_tag || '';

                    document.getElementById('obs-kp').innerText = `Kp ${kpVal}`;
                    document.getElementById('obs-kp-sub').innerText = `UTC: ${String(timeTag).replace('T', ' ').substring(11, 16)}`;

                    const sliceKp = dataKp.slice(-10);
                    timeLabels = sliceKp.map(i => String(i.time_tag || '').substring(11, 16));
                    kpArray = sliceKp.map(i => parseFloat(i.kp));
                }
            } catch (e) {
                document.getElementById('obs-kp').innerText = "Errore NOAA Kp";
                console.error("Kp error:", e);
            }

            // 2. NOAA Solar Wind Plasma tramite Proxy CORS
            try {
                const targetWind = 'https://services.swpc.noaa.gov/products/solar-wind/plasma-6-hour.json';
                const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetWind)}`);
                const dataWind = await res.json();
                if (Array.isArray(dataWind) && dataWind.length > 1) {
                    const validRows = dataWind.filter(row => row && !isNaN(parseFloat(row[2])));
                    if (validRows.length > 0) {
                        const latestW = validRows[validRows.length - 1];
                        const density = parseFloat(latestW[1]).toFixed(2);
                        const speed = Math.round(parseFloat(latestW[2]));

                        document.getElementById('obs-wind').innerText = `${speed} km/s`;
                        document.getElementById('obs-wind-sub').innerText = `Densità: ${density} p/cm³`;

                        const sliceWind = validRows.slice(-10);
                        windArray = sliceWind.map(i => Math.round(parseFloat(i[2])));
                    }
                }
            } catch (e) {
                document.getElementById('obs-wind').innerText = "Errore NOAA Wind";
                console.error("Wind error:", e);
            }

            // 3. USGS Earthquakes
            try {
                const resUsgs = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson');
                const dataUsgs = await resUsgs.json();
                if (dataUsgs && dataUsgs.features) {
                    document.getElementById('obs-quake').innerText = `${dataUsgs.features.length} Eventi (M > 4.5)`;
                    if (dataUsgs.features.length > 0) {
                        const maxM = Math.max(...dataUsgs.features.map(f => f.properties.mag));
                        document.getElementById('obs-quake-sub').innerText = `Max Magnitudo: M ${maxM.toFixed(1)}`;
                    }
                }
            } catch (e) {
                document.getElementById('obs-quake').innerText = "USGS N/D";
            }

            // Aggiornamento Plotter
            if (myChart && timeLabels.length > 0) {
                myChart.data.labels = timeLabels;
                myChart.data.datasets[0].data = kpArray;
                myChart.data.datasets[1].data = windArray;
                myChart.update();
            }
        }

        loadRealData();
        setInterval(loadRealData, 600000);
    </script>
