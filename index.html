
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nowcasting Italia — Dashboard Enterprise</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;background:#020916;
 font-family:system-ui,-apple-system,Arial,sans-serif;
 color:#c9f3ff;
}
body{
 display:flex;flex-direction:column;
 padding:6px;position:relative;
 background:linear-gradient(135deg,#020714,#081b35,#020714);
}
/* CORNICE ENTERPRISE */
#enterprise-border{
 position:absolute;inset:1px;
 width:calc(100% - 2px);height:calc(100% - 2px);
 z-index:40;pointer-events:none;overflow:visible;
}
#border-track{
 fill:none;stroke:#19bfff;stroke-width:1.5;
 animation:borderPulse 4.5s ease-in-out infinite;
}
@keyframes borderPulse{
 0%,100%{
  stroke:#087fc5;
  filter:drop-shadow(0 0 3px #008cff);
 }
 50%{
  stroke:#65edff;
  filter:drop-shadow(0 0 9px #00cfff);
 }
}
#comet-halo{fill:#00aaff;opacity:.22}
#comet-tail{fill:#40ceff;opacity:.55}
#comet-core{
 fill:#efffff;
 filter:drop-shadow(0 0 4px #42dfff)
        drop-shadow(0 0 7px #008cff);
}
.bridge-header{
 height:46px;min-height:46px;
 display:flex;align-items:center;
 justify-content:space-between;
 padding:0 12px;gap:8px;
 flex-shrink:0;position:relative;z-index:10;
 background:linear-gradient(90deg,#061122,#10375b,#061122);
 border:1px solid #188fc7;
 border-radius:12px 12px 4px 4px;
 box-shadow:inset 0 0 12px #00aaff22;
}
.brand{
 display:flex;align-items:center;gap:9px;min-width:0;
}
.brand-orbit{
 width:30px;height:30px;flex-shrink:0;
 border:1px solid #42dfff;border-radius:50%;
 display:grid;place-items:center;
 color:#9ceeff;font-size:19px;
 box-shadow:0 0 8px #00bfff77;
}
.brand-name{
 font-size:clamp(10px,2.5vw,15px);
 font-weight:950;letter-spacing:1px;
 color:#b8f1ff;text-shadow:0 0 8px #00bfff;
 white-space:nowrap;
}
.brand-sub{
 font-size:8px;font-weight:800;
 letter-spacing:2px;color:#54cfff;
}
.header-right{
 display:flex;align-items:center;gap:8px;
}
.status-ok{
 color:#4ade80;font-size:9px;font-weight:800;
}
.audio-btn{
 width:29px;height:29px;flex-shrink:0;
 border-radius:50%;cursor:pointer;
 border:1px solid #39dfff;
 background:#061b31;color:#a4f2ff;
 box-shadow:0 0 6px #00bfff55;
}
.audio-btn.playing{
 border-color:#ff5d9a;color:#ff5d9a;
}
.tactical-nav{
 width:100%;height:49px;min-height:49px;
 display:flex;align-items:center;gap:7px;
 padding:0 10px;overflow-x:auto;overflow-y:hidden;
 white-space:nowrap;flex-shrink:0;z-index:10;
 -webkit-overflow-scrolling:touch;
 scrollbar-width:thin;scrollbar-color:#168bc8 #071629;
 background:linear-gradient(#061426,#0b2440);
 border-bottom:1px solid #158cc7;
}
.tactical-btn{
 display:inline-flex;align-items:center;
 justify-content:center;gap:7px;
 flex-shrink:0;min-height:33px;
 padding:7px 11px;border-radius:10px;
 border:1px solid #168fd1;
 background:linear-gradient(#0c2b4b,#061426);
 color:#76eaff;font-size:9px;font-weight:850;
 text-transform:uppercase;text-decoration:none;
 cursor:pointer;
 box-shadow:inset 0 0 7px #00bfff22;
 transition:border-color .2s,background .2s;
}
.tactical-btn.active{
 color:#fff;border-color:#76eaff;
 background:linear-gradient(#164875,#09203b);
 box-shadow:0 0 9px #00bfff88,
 inset 0 0 8px #00bfff44;
}
.tactical-btn.amber{
 border-color:#d9ae34;color:#ffdb71;
}
.tactical-btn.amber.active{
 background:#d9ae34;color:#020916;
}
.tactical-btn.alert{
 border-color:#b84970;color:#ff91ad;
}
.tactical-btn.alert.active{
 background:#b84970;color:#fff;
}
.tactical-btn.iride-btn{
 height:36px;padding:3px 12px 3px 6px;
 border-color:#62cfff;
 background:linear-gradient(110deg,#07162b,#144676,#07162b);
 color:#b5eaff;
 animation:irideBorder 4s ease-in-out infinite;
}
@keyframes irideBorder{
 0%,100%{border-color:#267bd3}
 50%{border-color:#83e4ff}
}
.iride-eye{
 position:relative;width:28px;height:19px;
 flex:0 0 28px;display:grid;place-items:center;
}
.iride-eye-outline{
 position:absolute;width:25px;height:15px;
 border:1.5px solid #8cdbff;
 border-radius:75% 12%;
 transform:rotate(45deg);
 box-shadow:0 0 5px #42b8ff;
}
.iride-iris{
 width:15px;height:15px;border-radius:50%;
 border:1px solid #a4edff;
 background:conic-gradient(
 #12509a,#3bd7f0,#7b63ff,#39cfff,#12509a);
 box-shadow:0 0 7px #3bbdff;
 display:grid;place-items:center;
 animation:catLook 5.5s ease-in-out infinite,
 catColors 8s linear infinite;
}
.iride-pupil{
 width:3px;height:11px;border-radius:50%;
 background:#020917;
 animation:catPupil 5.5s ease-in-out infinite;
}
.iride-name{
 font-size:11px;font-weight:950;
 letter-spacing:1.3px;
 animation:irideText 2.4s ease-in-out infinite;
}
@keyframes catLook{
 0%,100%{transform:translateX(-3px)}
 25%{transform:translateX(3px)}
 50%{transform:translateX(2px)}
 75%{transform:translateX(-2px)}
}
@keyframes catColors{
 0%,100%{filter:hue-rotate(0deg)}
 50%{filter:hue-rotate(65deg)}
}
@keyframes catPupil{
 0%,100%{transform:scaleX(.75)}
 25%{transform:scaleX(1.5)}
 50%{transform:scaleX(.55)}
 75%{transform:scaleX(1.25)}
}
@keyframes irideText{
 0%,100%{text-shadow:0 0 3px #1f85ff}
 50%{text-shadow:0 0 10px #6de6ff}
}
.viewscreen-container{
 width:100%;flex:1;min-height:0;
 background:#061020;overflow:hidden;
 position:relative;
 border:1px solid #096b9c;border-top:0;
 border-radius:0 0 9px 9px;
}
#viewscreen-iframe{
 display:block;width:100%;height:100%;border:0;
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{
  animation:none!important;
  transition:none!important;
 }
}
</style>
</head>
<body>

<!-- PERCORSO LUMINOSO CONTINUO -->
<svg id="enterprise-border" aria-hidden="true">
 <defs>
  <path id="comet-route" d="M 14 1 H 100"/>
 </defs>
 <path id="border-track" d=""/>
 <g id="comet">
  <circle id="comet-halo" r="8"/>
  <circle id="comet-tail" cx="-4" r="3.5"/>
  <circle id="comet-core" r="2.2"/>
  <animateMotion
   dur="12s"
   repeatCount="indefinite"
   rotate="auto">
   <mpath href="#comet-route"/>
  </animateMotion>
 </g>
</svg>

<header class="bridge-header">
 <div class="brand">
  <div class="brand-orbit">◉</div>
  <div>
   <div class="brand-name">NOWCASTING ITALIA</div>
   <div class="brand-sub">DASHBOARD ENTERPRISE</div>
  </div>
 </div>
 <div class="header-right">
  <button id="audio-btn" class="audio-btn"
   onclick="toggleMusic()" title="Colonna sonora">
   🔊
  </button>
  <span class="status-ok">● OK</span>
 </div>
</header>

<audio id="tactical-audio"
 src="https://files.catbox.moe/ltr70o.mp3"
 loop preload="none"></audio>

<nav class="tactical-nav">
 <button class="tactical-btn iride-btn active"
  onclick="switchTracker('https://19francomenenti73-dev.github.io/Iride/',this)"
  title="I.R.I.D.E. — Radar Intelligence 3D">
  <span class="iride-eye" aria-hidden="true">
   <span class="iride-eye-outline"></span>
   <span class="iride-iris">
    <span class="iride-pupil"></span>
   </span>
  </span>
  <span class="iride-name">I.R.I.D.E.</span>
 </button>

 <a class="tactical-btn"
  href="https://iride.nowcasting-italia.com/"
  target="_blank" rel="noopener noreferrer">
  ⛶ ESPANDI I.R.I.D.E.
 </a>

 <button class="tactical-btn"
  onclick="switchTracker('https://19francomenenti73-dev.github.io/Z.E.U.S./',this)">
  ⚡ Z.E.U.S.
 </button>

 <button class="tactical-btn amber"
  onclick="switchTracker('https://19francomenenti73-dev.github.io/Snow-tracker/',this)">
  ❄️ Snow Tracker
 </button>

 <button class="tactical-btn"
  onclick="switchTracker('https://19francomenenti73-dev.github.io/Dashboard-Enterprise/world-tracker.html',this)">
  🌍 World Storm Tracker
 </button>

 <button class="tactical-btn alert"
  onclick="switchTracker('https://19francomenenti73-dev.github.io/hurricane-tracker/',this)">
  🌀 Hurricane Tracker
 </button>

 <button class="tactical-btn alert"
  onclick="switchTracker('https://19francomenenti73-dev.github.io/earthquake-tracker-/',this)">
  🌋 Earthquake Tracker
 </button>

 <button class="tactical-btn alert"
  onclick="switchTracker('https://19francomenenti73-dev.github.io/archivio-eventi/',this)">
  📍 Archivio Eventi
 </button>
</nav>

<div class="viewscreen-container">
 <iframe id="viewscreen-iframe"
  src="https://19francomenenti73-dev.github.io/Iride/"
  title="Visualizzatore Nowcasting Italia"
  allowfullscreen></iframe>
</div>

<script>
// CORNICE SVG ADATTIVA
function updateEnterpriseBorder(){
 const svg=document.getElementById('enterprise-border');
 const w=svg.clientWidth;
 const h=svg.clientHeight;
 if(w<30||h<30)return;

 svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
 const r=12;
 const x=1.5,y=1.5;
 const right=w-1.5,bottom=h-1.5;
 const d=[
  `M ${x+r} ${y}`,
  `H ${right-r}`,
  `Q ${right} ${y} ${right} ${y+r}`,
  `V ${bottom-r}`,
  `Q ${right} ${bottom} ${right-r} ${bottom}`,
  `H ${x+r}`,
  `Q ${x} ${bottom} ${x} ${bottom-r}`,
  `V ${y+r}`,
  `Q ${x} ${y} ${x+r} ${y}`,
  'Z'
 ].join(' ');

 document.getElementById('border-track')
  .setAttribute('d',d);
 document.getElementById('comet-route')
  .setAttribute('d',d);
}
const borderObserver=new ResizeObserver(
 updateEnterpriseBorder
);
borderObserver.observe(
 document.getElementById('enterprise-border')
);
updateEnterpriseBorder();

// TRACKER: REFRESH OGNI 30 MINUTI
const TRACKER_REFRESH_MS=30*60*1000;
const trackerFrame=document.getElementById(
 'viewscreen-iframe'
);
let activeTrackerUrl=trackerFrame.getAttribute('src');
let lastTrackerLoad=Date.now();

function trackerUrlWithoutCache(url){
 const parsed=new URL(url,window.location.href);
 parsed.searchParams.delete('_dashboard_refresh');
 return parsed.toString();
}
function loadTracker(url){
 activeTrackerUrl=trackerUrlWithoutCache(url);
 const parsed=new URL(activeTrackerUrl);
 parsed.searchParams.set(
  '_dashboard_refresh',String(Date.now())
 );
 lastTrackerLoad=Date.now();
 trackerFrame.src=parsed.toString();
}
function refreshTrackerIfNeeded(){
 if(document.visibilityState==='hidden')return;
 if(Date.now()-lastTrackerLoad<TRACKER_REFRESH_MS)return;
 loadTracker(activeTrackerUrl);
}
function switchTracker(url,btnElement){
 loadTracker(url);
 document.querySelectorAll('.tactical-btn').forEach(
  b=>b.classList.remove('active')
 );
 btnElement.classList.add('active');
}
setInterval(refreshTrackerIfNeeded,60*1000);
document.addEventListener(
 'visibilitychange',refreshTrackerIfNeeded
);
window.addEventListener(
 'pageshow',refreshTrackerIfNeeded
);
window.addEventListener(
 'focus',refreshTrackerIfNeeded
);
loadTracker(activeTrackerUrl);

// COLONNA SONORA
function toggleMusic(){
 const audio=document.getElementById('tactical-audio');
 const btn=document.getElementById('audio-btn');
 if(audio.paused){
  audio.play().then(()=>{
   btn.classList.add('playing');
   btn.textContent='🎶';
  }).catch(err=>console.log(err));
 }else{
  audio.pause();
  btn.classList.remove('playing');
  btn.textContent='🔊';
 }
}
</script>
</body>
</html>
