<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nowcasting Italia — Dashboard</title>
  
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #030712;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header Compatto Ridotto */
    .bridge-header {
      width: 100%;
      height: 32px;
      min-height: 32px;
      background: #080e1c;
      border-bottom: 2px solid #00f0ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      flex-shrink: 0;
      z-index: 10;
    }

    .pulsing-title {
      font-size: 9px;
      font-weight: 900;
      color: #00f0ff;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: blue-pulse 2s infinite ease-in-out;
    }

    @keyframes blue-pulse {
      0% { opacity: 0.6; text-shadow: 0 0 4px rgba(0,240,255,0.4); }
      50% { opacity: 1; text-shadow: 0 0 12px rgba(0,240,255,0.9); }
      100% { opacity: 0.6; text-shadow: 0 0 4px rgba(0,240,255,0.4); }
    }

    .header-right-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-ok {
      font-size: 8px;
      color: #4ade80;
      font-weight: 800;
    }

    .audio-tactical-btn {
      background: rgba(8, 14, 28, 0.9);
      border: 1px solid #4ade80;
      color: #4ade80;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 10px;
    }

    .audio-tactical-btn.playing {
      border-color: #ff2a5f;
      color: #ff2a5f;
    }

    /* Barra Navigazione Compatta CORRETTA */
    .tactical-nav {
      width: 100%;
      height: 32px;
      min-height: 32px;
      background: #0d1527;
      border-bottom: 1px solid rgba(0, 240, 255, 0.3);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      flex-shrink: 0;
      z-index: 10;
    }

    .tactical-btn {
      background: rgba(13, 25, 48, 0.9);
      color: #00f0ff;
      border: 1px solid rgba(0, 240, 255, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 7.5px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      flex-shrink: 0 !important;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .tactical-btn.active {
      background: #00f0ff;
      color: #030712;
      font-weight: 900;
    }

    .tactical-btn.amber { border-color: #facc15; color: #facc15; }
    .tactical-btn.amber.active { background: #facc15; color: #030712; }

    .tactical-btn.alert { border-color: #ff2a5f; color: #ff2a5f; }
    .tactical-btn.alert.active { background: #ff2a5f; color: #fff; }

    /* Pulsante Laboratory EXP */
    .tactical-btn.lab-exp-btn {
      background: rgba(13, 25, 48, 0.9);
      border: 2px solid #facc15;
      color: #facc15;
      font-weight: 900;
      flex-shrink: 0 !important;
      box-shadow: 0 0 8px rgba(250, 204, 21, 0.3);
      transition: all 0.3s ease;
    }

    .tactical-btn.lab-exp-btn:hover,
    .tactical-btn.lab-exp-btn.active {
      background: #facc15;
      color: #030712;
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.8);
    }

    .lightning-pulse {
      color: #00f0ff;
      display: inline-block;
      margin-right: 3px;
      animation: blueLightningPulse 1.2s infinite alternate;
    }

    @keyframes blueLightningPulse {
      0% { text-shadow: 0 0 4px #00f0ff; transform: scale(1); }
      100% { text-shadow: 0 0 12px #00f0ff; transform: scale(1.25); }
    }
