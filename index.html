
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nowcasting Italia — Dashboard</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html, body {
  width: 100%;
  height: 100%;
  min-height: 100%;
  background: #030712;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
body {
  position: relative;
  padding: 5px;
  background: linear-gradient(145deg,#030712,#07162b 55%,#030712);
}
/* Cornice elettrica: non copre i controlli */
body::before {
  content: "";
  position: absolute;
  inset: 2px;
  border: 1px solid #19cfff;
  border-radius: 12px;
  pointer-events: none;
  z-index: 30;
  animation: electric-frame 4.5s ease-in-out infinite;
}
@keyframes electric-frame {
  0%,100% {
    border-color: #087fc5;
    box-shadow: 0 0 4px #008cff66,
                inset 0 0 4px #008cff33;
  }
  50% {
    border-color: #42eaff;
    box-shadow: 0 0 11px #00bfff99,
                inset 0 0 8px #00bfff55;
  }
}
.bridge-header {
  width: 100%;
  height: 40px;
  min-height: 40px;
  background: linear-gradient(90deg,#061122,#0a1d36,#061122);
  border-bottom: 1px solid #139bd4;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 12px;
  flex-shrink: 0;
  z-index: 10;
  position: relative;
}
.bridge-header::after {
  content: "";
  position: absolute;
  bottom: -1px;
  left: 15%;
  right: 15%;
  height: 1px;
  background: #38dfff;
  box-shadow: 0 0 9px #00bfff;
  pointer-events: none;
}
.pulsing-title {
  font-size: clamp(9px,2.3vw,14px);
  font-weight: 900;
  color: #72eaff;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  animation: blue-pulse 3s infinite ease-in-out;
}
@keyframes blue-pulse {
  0%,100% {
    text-shadow: 0 0 4px #00bfff66;
  }
  50% {
    text-shadow: 0 0 12px #00dfff;
  }
}
.header-right-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.status-ok {
  font-size: 9px;
  color: #4ade80;
  font-weight: 800;
}
.audio-tactical-btn {
  background: #071a30;
  border: 1px solid #38cfff;
  color: #7beaff;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  font-size: 12px;
  box-shadow: 0 0 5px #00bfff44;
}
.audio-tactical-btn.playing {
  border-color: #ff2a5f;
  color: #ff2a5f;
}
.tactical-nav {
  width: 100%;
  height: 49px;
  min-height: 49px;
  background: linear-gradient(180deg,#061426,#091c34);
  border-bottom: 1px solid #0879ba;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 10px;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: #138bcb #091c34;
  flex-shrink: 0;
  z-index: 10;
}
.tactical-btn {
  background: linear-gradient(180deg,#0b2340,#061426);
  color: #5ce7ff;
  border: 1px solid #168fd1;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  cursor: pointer;
  flex-shrink: 0 !important;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 31px;
  box-shadow: inset 0 0 5px #00bfff22,
              0 0 5px #00bfff33;
  transition: background .2s,border-color .2s;
}
.tactical-btn.active {
  background: linear-gradient(180deg,#123b66,#071b34);
  color: #fff;
  border-color: #6ceaff;
  box-shadow: 0 0 9px #00bfff88,
              inset 0 0 8px #00bfff44;
}
.tactical-btn.amber {
  border-color: #facc15;
  color: #facc15;
}
.tactical-btn.amber.active {
  background: #facc15;
  color: #030712;
}
.tactical-btn.alert {
  border-color: #ff2a5f;
  color: #ff7d9c;
}
.tactical-btn.alert.active {
  background: #ff2a5f;
  color: #fff;
}
.tactical-btn.iride-btn {
  position: relative;
  height: 35px;
  gap: 7px;
  padding: 3px 12px 3px 6px;
  overflow: hidden;
  border: 1px solid #51baff;
  border-radius: 9px;
  background: linear-gradient(110deg,#08172d,#103d68,#08172d);
  color: #a9e8ff;
  box-shadow: inset 0 0 8px #278cff44,
              0 0 7px #278cff44;
  animation: iride-border 4s ease-in-out infinite;
}
.iride-eye {
  position: relative;
  width: 28px;
  height: 19px;
  flex: 0 0 28px;
  display: grid;
  place-items: center;
}
.iride-eye-outline {
  position: absolute;
  width: 25px;
  height: 15px;
  border: 1.5px solid #8cdbff;
  border-radius: 75% 12%;
  transform: rotate(45deg);
  box-shadow: 0 0 5px #42b8ff;
}
.iride-iris {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 1px solid #a4edff;
  background: conic-gradient(
    #12509a,#3bd7f0,#7b63ff,#39cfff,#12509a
  );
  box-shadow: 0 0 7px #3bbdff;
  display: grid;
  place-items: center;
  animation: cat-look 5.5s ease-in-out infinite,
             cat-colors 8s linear infinite;
}
.iride-pupil {
  width: 3px;
  height: 11px;
  border-radius: 50%;
  background: #020917;
  box-shadow: 1px 0 2px #c2faff;
  animation: cat-pupil 5.5s ease-in-out infinite;
}
.iride-name {
  font-size: 11px;
  font-weight: 950;
  letter-spacing: 1.3px;
  animation: iride-text 2.4s ease-in-out infinite;
}
@keyframes cat-look {
  0%,100% { transform: translateX(-3px); }
  25% { transform: translateX(3px); }
  50% { transform: translateX(2px); }
  75% { transform: translateX(-2px); }
}
@keyframes cat-colors {
  0%,100% { filter: hue-rotate(0deg); }
  50% { filter: hue-rotate(65deg); }
}
@keyframes cat-pupil {
  0%,100% { transform: scaleX(.75); }
  25% { transform: scaleX(1.5); }
  50% { transform: scaleX(.55); }
  75% { transform: scaleX(1.25); }
}
@keyframes iride-text {
  0%,100% { text-shadow: 0 0 3px #1f85ff; }
  50% { text-shadow: 0 0 10px #6de6ff; }
}
@keyframes iride-border {
  0%,100% { border-color: #267bd3; }
  50% { border-color: #83e4ff; }
}
.tactical-btn.iride-btn.active {
  color: #d6f6ff;
  background: linear-gradient(110deg,#0a2442,#14518b,#0a2442);
  box-shadow: 0 0 10px #3aafff88;
}
.viewscreen-container {
  width: 100%;
  flex: 1;
  min-height: 0;
  background: #061020;
  overflow: hidden;
  position: relative;
  border-left: 1px solid #096b9c;
  border-right: 1px solid #096b9c;
  border-bottom: 1px solid #096b9c;
  border-radius: 0 0 8px 8px;
}
#viewscreen-iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body>
  
<header class="bridge-header">
  <div class="pulsing-title">
    Nowcasting Italia Dashboard
  </div>
  <div class="header-right-group">
    <button
      id="audio-btn"
      class="audio-tactical-btn"
      onclick="toggleMusic()"
      title="Colonna Sonora"
    >🔊</button>
    <div class="status-ok">● OK</div>
  </div>
</header>

<audio
  id="tactical-audio"
  src="https://files.catbox.moe/ltr70o.mp3"
  loop
  preload="auto"
></audio>

<nav class="tactical-nav">

  <button
    class="tactical-btn iride-btn active"
    onclick="switchTracker('https://19francomenenti73-dev.github.io/Iride/',this)"
    title="I.R.I.D.E. — Radar Intelligence 3D"
    aria-label="Apri I.R.I.D.E."
  >
    <span class="iride-eye" aria-hidden="true">
      <span class="iride-eye-outline"></span>
      <span class="iride-iris">
        <span class="iride-pupil"></span>
      </span>
    </span>
    <span class="iride-name">I.R.I.D.E.</span>
  </button>

  <a
    class="tactical-btn"
    href="https://iride.nowcasting-italia.com/"
    target="_blank"
    rel="noopener noreferrer"
    title="Apri I.R.I.D.E. in una nuova scheda"
    aria-label="Espandi I.R.I.D.E."
    style="text-decoration:none;min-height:35px"
  >⛶ ESPANDI I.R.I.D.E.</a>

  <button
    class="tactical-btn"
    onclick="switchTracker('https://19francomenenti73-dev.github.io/Z.E.U.S./',this)"
    title="Z.E.U.S. — Osservazione satellitare"
    aria-label="Apri Z.E.U.S."
  >⚡ Z.E.U.S.</button>

  <button
    class="tactical-btn amber"
    onclick="switchTracker('https://19francomenenti73-dev.github.io/Snow-tracker/',this)"
  >❄️ Snow Tracker</button>

  <button
    class="tactical-btn"
    onclick="switchTracker('https://19francomenenti73-dev.github.io/Dashboard-Enterprise/world-tracker.html',this)"
  >🌍 World Storm Tracker</button>

  <button
    class="tactical-btn alert"
    onclick="switchTracker('https://19francomenenti73-dev.github.io/hurricane-tracker/',this)"
  >🌀 Hurricane Tracker</button>

  <button
    class="tactical-btn alert"
    onclick="switchTracker('https://19francomenenti73-dev.github.io/earthquake-tracker-/',this)"
  >🌋 Earthquake Tracker</button>

  <button
    class="tactical-btn alert"
    onclick="switchTracker('https://19francomenenti73-dev.github.io/archivio-eventi/',this)"
  >📍 Archivio Eventi</button>

</nav>

<div class="viewscreen-container">
  <iframe
    id="viewscreen-iframe"
    src="https://19francomenenti73-dev.github.io/Iride/"
    title="Visualizzatore Nowcasting Italia"
    allowfullscreen
  ></iframe>
</div>

<script>
// Aggiornamento controllato del solo tracker visualizzato.
// Non modifica le pagine dei tracker né i workflow esterni.
const TRACKER_REFRESH_MS = 30 * 60 * 1000;
const trackerFrame = document.getElementById('viewscreen-iframe');
let activeTrackerUrl = trackerFrame.getAttribute('src');
let lastTrackerLoad = Date.now();

function trackerUrlWithoutCache(url) {
  const parsed = new URL(url, window.location.href);
  parsed.searchParams.delete('_dashboard_refresh');
  return parsed.toString();
}

function loadTracker(url) {
  activeTrackerUrl = trackerUrlWithoutCache(url);
  const parsed = new URL(activeTrackerUrl);
  parsed.searchParams.set('_dashboard_refresh', String(Date.now()));
  lastTrackerLoad = Date.now();
  trackerFrame.src = parsed.toString();
}

function refreshTrackerIfNeeded() {
  if (document.visibilityState === 'hidden') return;
  if (Date.now() - lastTrackerLoad < TRACKER_REFRESH_MS) return;
  loadTracker(activeTrackerUrl);
}

function switchTracker(url, btnElement) {
  loadTracker(url);
  document.querySelectorAll('.tactical-btn').forEach(
    b => b.classList.remove('active')
  );
  btnElement.classList.add('active');
}

// In primo piano: controllo periodico, senza ricariche inutili.
setInterval(refreshTrackerIfNeeded, 60 * 1000);
// Android può sospendere i timer: al ritorno si verifica subito l'età.
document.addEventListener('visibilitychange', refreshTrackerIfNeeded);
window.addEventListener('pageshow', refreshTrackerIfNeeded);
window.addEventListener('focus', refreshTrackerIfNeeded);
// Anche alla prima apertura, richiedi una versione non memorizzata dell'iframe.
loadTracker(activeTrackerUrl);

function toggleMusic() {
  const audio = document.getElementById('tactical-audio');
  const btn = document.getElementById('audio-btn');

  if (audio.paused) {
    audio.play().then(() => {
      btn.classList.add('playing');
      btn.innerText = '🎶';
    }).catch(err => console.log(err));
  } else {
    audio.pause();
    btn.classList.remove('playing');
    btn.innerText = '🔊';
  }
}
</script>

</body>
</html>
