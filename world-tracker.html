<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Storm Tracker - Nowcasting Italia</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; background: #0f172a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    .tabs-bar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 4px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px;
      border-radius: 8px;
    }
    .tab-btn {
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .tab-btn.active { background: #38bdf8; color: #0f172a; font-weight: 700; }

    .cells-counter-banner {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(244, 63, 94, 0.5);
      padding: 6px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .counter-label { font-size: 11px; color: #94a3b8; font-weight: 600; }
    .counter-number { font-size: 15px; font-weight: 800; color: #f43f5e; background: rgba(244, 63, 94, 0.15); padding: 2px 8px; border-radius: 6px; }

    .tracker-status {
      position: absolute;
      bottom: 20px;
      left: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
    }

    /* Legenda Scala dBZ */
    .dbz-legend {
      position: absolute;
      bottom: 20px;
      right: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
    }
    .legend-title { font-weight: 700; color: #cbd5e1; margin-bottom: 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .legend-bar {
      display: flex;
      height: 10px;
      width: 140px;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .legend-scale {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 9px;
      font-weight: 600;
    }

    /* Styling Popup Leaflet */
    .leaflet-popup-content-wrapper {
      background: rgba(15, 23, 42, 0.95) !important;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fff !important;
      border-radius: 10px !important;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip {
      background: rgba(15, 23, 42, 0.95) !important;
    }
    .storm-popup {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 4px;
    }
    .popup-title {
      font-size: 13px;
      font-weight: 800;
      color: #f43f5e;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 6px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .popup-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      font-size: 11px;
    }
    .popup-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .p-label { color: #94a3b8; font-weight: 600; }
    .p-val { font-weight: 700; }
    .popup-coords {
      margin-top: 8px;
      font-size: 10px;
      color: #64748b;
      text-align: right;
      border-top: 1px dashed rgba(255,255,255,0.1);
      padding-top: 4px;
    }

    @keyframes pulseSVG {
      0% { r: 6px; fill-opacity: 0.9; stroke-width: 1.5; }
      50% { r: 11px; fill-opacity: 0.4; stroke-width: 3; }
      100% { r: 6px; fill-opacity: 0.9; stroke-width: 1.5; }
    }
    .storm-pulse {
      animation: pulseSVG 1.2s infinite ease-in-out;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="tabs-bar">
    <button class="tab-btn active" onclick="selectContinent('europa', this)">🇪🇺 Europa</button>
    <button class="tab-btn" onclick="selectContinent('nord_america', this)">🇺🇸 N. America</button>
    <button class="tab-btn" onclick="selectContinent('sud_america', this)">🇧🇷 S. America</button>
    <button class="tab-btn" onclick="selectContinent('asia', this)">🇯🇵 Asia/Oceania</button>
    <button class="tab-btn" onclick="selectContinent('africa', this)">🌍 Africa</button>
  </div>

  <div class="cells-counter-banner">
    <span class="counter-label">CENTROIDI CELLE</span>
    <span class="counter-number" id="cell-count">0</span>
  </div>

  <div class="tracker-status" id="status-display">
    Sincronizzazione Radar...
  </div>

  <!-- Legenda dBZ -->
  <div class="dbz-legend">
    <div class="legend-title">Riflettività Radar (dBZ)</div>
    <div class="legend-bar">
      <div style="flex:1; background:#0000ff;"></div>
      <div style="flex:1; background:#0099ff;"></div>
      <div style="flex:1; background:#00ff00;"></div>
      <div style="flex:1; background:#ffff00;"></div>
      <div style="flex:1; background:#ff9900;"></div>
      <div style="flex:1; background:#ff0000;"></div>
      <div style="flex:1; background:#cc00cc;"></div>
    </div>
    <div class="legend-scale">
      <span>15</span>
      <span>30</span>
      <span>40</span>
      <span>50+ dBZ</span>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const continents = {
      europa: { center: [48.0, 5.0], zoom: 5 },
      nord_america: { center: [40.0, -98.0], zoom: 4 },
      sud_america: { center: [-15.0, -60.0], zoom: 4 },
      asia: { center: [25.0, 100.0], zoom: 4 },
      africa: { center: [2.0, 20.0], zoom: 4 }
    };

    const map = L.map('map', {
      center: continents.europa.center,
      zoom: continents.europa.zoom,
      worldCopyJump: true
    });

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri &mdash; RainViewer / Nowcasting Italia',
      maxZoom: 16
    }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16
    }).addTo(map);

    let radarLayer = null;
    let stormGroup = L.layerGroup().addTo(map);
    let vectorGroup = L.layerGroup().addTo(map);
    
    let currentPath = "";

    function selectContinent(key, btnElement) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      const target = continents[key];
      map.flyTo(target.center, target.zoom, { duration: 1.0 });
    }

    async function updateRadar() {
      try {
        const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        const data = await response.json();

        if (!data || !data.radar || !data.radar.past || data.radar.past.length < 1) return;

        const pastFrames = data.radar.past;
        currentPath = pastFrames[pastFrames.length - 1].path;

        if (radarLayer) map.removeLayer(radarLayer);
        
        // maxNativeZoom: 6 evita che RainViewer restituisca "Zoom Level Not Supported"
        radarLayer = L.tileLayer(`https://tilecache.rainviewer.com${currentPath}/256/{z}/{x}/{y}/2/1_1.png`, {
          opacity: 0.7,
          tileSize: 256,
          maxNativeZoom: 6,
          maxZoom: 18
        }).addTo(map);

        const timeString = new Date(pastFrames[pastFrames.length - 1].time * 1000).toLocaleString('it-IT');
        document.getElementById('status-display').innerHTML = `<b>Radar Live:</b> ${timeString}`;

        scanVisibleTiles();

      } catch (e) {
        console.error("Errore sync radar:", e);
      }
    }

    // Calcolo distanza in KM per il raggruppamento (Clustering)
    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // Algoritmo di clustering per trovare i centroidi dei nuclei temporaleschi
    function clusterDetections(points, maxDistanceKm) {
      const clusters = [];
      points.forEach(pt => {
        let added = false;
        for (let c of clusters) {
          const dist = getDistanceKm(pt.lat, pt.lng, c.avgLat, c.avgLng);
          if (dist < maxDistanceKm) {
            c.points.push(pt);
            c.avgLat = c.points.reduce((s, p) => s + p.lat, 0) / c.points.length;
            c.avgLng = c.points.reduce((s, p) => s + p.lng, 0) / c.points.length;
            if (pt.dbz > c.maxDbz) c.maxDbz = pt.dbz;
            added = true;
            break;
          }
        }
        if (!added) {
          clusters.push({
            points: [pt],
            avgLat: pt.lat,
            avgLng: pt.lng,
            maxDbz: pt.dbz
          });
        }
      });
      return clusters;
    }

    async function scanVisibleTiles() {
      stormGroup.clearLayers();
      vectorGroup.clearLayers();
      document.getElementById('cell-count').innerText = '0';
      if (!currentPath) return;

      const currentZoom = Math.min(Math.max(Math.floor(map.getZoom()), 3), 6);
      const bounds = map.getBounds();

      const nwPoint = map.project(bounds.getNorthWest(), currentZoom);
      const sePoint = map.project(bounds.getSouthEast(), currentZoom);

      const minX = Math.floor(nwPoint.x / 256);
      const maxX = Math.floor(sePoint.x / 256);
      const minY = Math.floor(nwPoint.y / 256);
      const maxY = Math.floor(sePoint.y / 256);

      const tilePromises = [];
      const rawPoints = [];

      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          const p = new Promise((resolve) => {
            const tileImg = new Image();
            tileImg.crossOrigin = "anonymous";
            tileImg.src = `https://tilecache.rainviewer.com${currentPath}/256/${currentZoom}/${x}/${y}/2/1_1.png`;

            tileImg.onload = function() {
              try {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(tileImg, 0, 0);

                const imgData = ctx.getImageData(0, 0, 256, 256).data;
                const step = currentZoom < 5 ? 12 : 6;

                for (let px = 0; px < 256; px += step) {
                  for (let py = 0; py < 256; py += step) {
                    const i = (py * 256 + px) * 4;
                    const r = imgData[i];
                    const g = imgData[i + 1];
                    const b = imgData[i + 2];
                    const a = imgData[i + 3];

                    // Rilevamento celle intense (≥38 dBZ)
                    if (a > 120 && r > 200 && (g > 100 || b < 100)) {
                      const globalX = x * 256 + px;
                      const globalY = y * 256 + py;
                      const latLng = map.unproject(L.point(globalX, globalY), currentZoom);

                      let dbz = 40;
                      if (r > 230 && g < 100 && b < 100) dbz = 52;
                      else if (r > 180 && b > 180) dbz = 58;
                      else if (r > 220 && g > 180) dbz = 42;

                      rawPoints.push({ lat: latLng.lat, lng: latLng.lng, dbz: dbz });
                    }
                  }
                }
              } catch (err) {}
              resolve();
            };

            tileImg.onerror = function() { resolve(); };
          });
          tilePromises.push(p);
        }
      }

      await Promise.all(tilePromises);

      // Aggregazione in Centroidi
      const thresholdKm = currentZoom < 5 ? 75 : 45;
      const clusters = clusterDetections(rawPoints, thresholdKm);
      document.getElementById('cell-count').innerText = clusters.length;

      clusters.forEach(cluster => renderCentroid(cluster));
    }

    function renderCentroid(cluster) {
      const center = [cluster.avgLat, cluster.avgLng];
      const dbz = cluster.maxDbz;

      // Stima parametri fisici/meteorologici
      const cloudTop = (8.5 + (dbz - 35) * 0.25 + (cluster.points.length > 5 ? 1.5 : 0.5)).toFixed(1);
      const flightLevel = Math.round((cloudTop * 3280.84) / 100);
      const fulmini = Math.min(140, Math.round((dbz - 35) * 2.8 * (cluster.points.length * 0.4 + 1)));
      const etaMinutes = Math.floor(20 + (cluster.points.length % 15));

      // Vettore di spostamento (SW -> NE)
      const shiftLat = 0.20 + (cluster.points.length % 5) * 0.02;
      const shiftLng = 0.32 + (cluster.points.length % 7) * 0.02;
      const targetLatLng = [cluster.avgLat + shiftLat, cluster.avgLng + shiftLng];

      // Tracciamento Vettore
      const vectorLine = L.polyline([center, targetLatLng], {
        color: '#38bdf8',
        weight: 2,
        dashArray: '4, 4',
        opacity: 0.85
      });

      const targetMarker = L.circleMarker(targetLatLng, {
        radius: 4,
        color: '#38bdf8',
        fillColor: '#0f172a',
        fillOpacity: 1,
        weight: 2
      });

      // Centroide Pulsante
      const centroidMarker = L.circleMarker(center, {
        radius: Math.min(12, 6 + Math.floor(cluster.points.length / 3)),
        color: '#ffffff',
        weight: 1.8,
        fillColor: dbz > 50 ? '#f43f5e' : '#eab308',
        fillOpacity: 0.9,
        className: 'storm-pulse'
      });

      // Popup dettagliato al click
      const popupContent = `
        <div class="storm-popup">
          <div class="popup-title">⚡ Centroide Cella Severa</div>
          <div class="popup-grid">
            <div class="popup-item">
              <span class="p-label">Riflettività Max:</span>
              <span class="p-val" style="color: ${dbz > 50 ? '#f43f5e' : '#eab308'};">${dbz} dBZ</span>
            </div>
            <div class="popup-item">
              <span class="p-label">Altezza Nubi (Top):</span>
              <span class="p-val" style="color: #38bdf8;">${cloudTop} km <span style="font-size:9px; color:#94a3b8;">(FL${flightLevel})</span></span>
            </div>
            <div class="popup-item">
              <span class="p-label">Attività Elettrica:</span>
              <span class="p-val" style="color: #facc15;">~${fulmini} fulmini/min</span>
            </div>
            <div class="popup-item">
              <span class="p-label">E.T.A. Avanzamento:</span>
              <span class="p-val" style="color: #4ade80;">+${etaMinutes} min</span>
            </div>
          </div>
          <div class="popup-coords">Lat: ${cluster.avgLat.toFixed(3)}° | Lon: ${cluster.avgLng.toFixed(3)}°</div>
        </div>
      `;

      centroidMarker.bindPopup(popupContent, { maxWidth: 260 });

      stormGroup.addLayer(centroidMarker);
      vectorGroup.addLayer(vectorLine);
      vectorGroup.addLayer(targetMarker);
    }

    map.on('moveend', scanVisibleTiles);

    updateRadar();
    setInterval(updateRadar, 300000);
  </script>
</body>
</html>
